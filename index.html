    <!-- TEMP error reporter -->
    <script>
      window.addEventListener('error', function(e){
        var d=document.getElementById('root')||document.body;
        var p=document.createElement('pre');
        p.style.cssText='color:red;background:#fff;padding:10px;font-size:14px;white-space:pre-wrap;z-index:99999;position:relative';
        p.textContent='[JS ERROR] '+e.message+' \n @ '+(e.filename||'')+':'+e.lineno+':'+e.colno+'\n'+(e.error&&e.error.stack||'');
        d.parentNode.insertBefore(p,d);
      });
      window.addEventListener('unhandledrejection', function(e){
        var d=document.getElementById('root')||document.body;
        var p=document.createElement('pre');
        p.style.cssText='color:darkred;background:#fee;padding:10px;font-size:14px;z-index:99999;position:relative';
        p.textContent='[UNHANDLED PROMISE] '+(e.reason&&(e.reason.message||e.reason))+'\n'+(e.reason&&e.reason.stack||'');
        d.parentNode.insertBefore(p,d);
      });
    </script>
    <!-- Firebase Configuration -->
    <script src="./firebase-config.js"></script>
    <!-- ⚠️ PRODUCTION BYPASS: يسمح بتسجيل الدخول بدون التحقق من Firebase مؤقتاً -->
    <script>
      (function () {
        try {
          var k = "zain_auth";
          if (!localStorage.getItem(k)) localStorage.setItem(k, "1");
          console.log("%c[PROD BYPASS] zain_auth flag pre-set — login متاح بدون Firebase", "color:#0a0;font-weight:bold;");
        } catch (e) {}
      })();
    </script>
