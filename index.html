            <span class="cart-price" id="footer-total">0.000 د.ك</span>
            <div class="cart-badge" id="footer-count">0</div>
        </div>
    </div>

    <script>
        const defaultProducts = [
            { name: 'عرض التين الأخضر الفاخر', desc: 'بوكس 5 كيلو تين أخضر فاخر.', price: '3.500', img: 'assets/images/teen-3.jpg' },
            { name: 'عرض كل الكويت الجديد', desc: '10 كيلو روبيان عماني جامبو طازج.', price: '5.000', img: 'assets/images/kuwaiti-jumbo-robian-10kg-new.jpg' },
            { name: 'عرض تمر الصقعي الملكي', desc: 'بوكس 5 كيلو تمر صقعي ملكي فاخر.', price: '3.960', img: 'assets/images/sakey-5.jpg' },
            { name: 'عرض تمر الخلاص المكبوس', desc: 'بوكس 8 كيلو تمر الخلاص المكبوس درجة أولى.', price: '3.960', img: 'assets/images/khals-8.jpg' },
            { name: 'عرض 50 عصفور التين', desc: 'بوكس 50 عصفور تين درجة أولى حجم كبير.', price: '7.000', img: 'assets/images/teen-50.jpg' },
            { name: 'عرض 5 بطات فرنسي', desc: 'بوكس 5 بطات فرنسي عمر 4 - 5 شهور.', price: '10.000', img: 'assets/images/batt-5.jpg' },
            { name: 'عرض 10 بطات فرنسي', desc: 'بوكس 10 بطات فرنسي عمر 4 - 5 شهور.', price: '20.000', img: 'assets/images/batt-10.jpg' },
            { name: 'بطة فرنسي', desc: 'بطة فرنسي عمر 4 - 5 شهور.', price: '4.000', img: 'assets/images/batt-1.jpg' },
            { name: 'بوكس 5 حمامات', desc: 'بوكس 5 حمامات - طازج وزن 750 جرام.', price: '4.000', img: 'assets/images/hamam-10.jpg' },
            { name: 'بوكس 10 حمامات', desc: 'بوكس 10 حمامات - طازج وزن 750 جرام.', price: '8.000', img: 'assets/images/hamam-10.jpg' },
            { name: 'بوكس 20 حمامة', desc: 'بوكس 20 حمامات - طازج وزن 750 جرام.', price: '12.000', img: 'assets/images/hamam-20.jpg' },
            { name: 'بوكس 10 حمامات زاجل', desc: 'بوكس 10 حمامات زاجل - طازج وزن 850 جرام.', price: '8.000', img: 'assets/images/zagel-10.jpg' },
            { name: 'البوكس الصغير - سمك البلطي', desc: 'بوكس سمك بلطي طازج 5 كيلو.', price: '12.000', img: 'assets/images/bolti-5.jpg' },
            { name: 'البوكس الكبير - سمك البلطي', desc: 'بوكس سمك بلطي طازج 10 كيلو.', price: '20.000', img: 'assets/images/bolti-10.jpg' },
            { name: 'بوكس 10 دجاج عربي ساسو', desc: 'بوكس 10 دجاجات عربي ساسو - طازج وزن 1000 - 1300 جرام.', price: '20.000', img: 'assets/images/saso-8.jpg' }
        ];

        function initializeDefaultProducts() {
            const stored = JSON.parse(localStorage.getItem('allProducts')) || [];
            if (stored.length === 0) {
                localStorage.setItem('allProducts', JSON.stringify(defaultProducts));
            }
        }

        // رابط صفحة المنتج الديناميكية (SEO) — /product/<id>/<slug>
        function productPageUrl(product) {
            if (!product._id) return null;
            const slug = (product.name || 'product').replace(/[^\w\s\u0600-\u06FF-]/g, '').trim().replace(/[\s_]+/g, '-');
            return '/product/' + product._id + '/' + encodeURIComponent(slug);
        }

        // فتح/إغلاق درج القائمة
        function toggleMenu(open) {
            const drawer = document.getElementById('menuDrawer');
            const overlay = document.getElementById('menuOverlay');
            const show = (typeof open === 'boolean') ? open : !drawer.classList.contains('open');
            drawer.classList.toggle('open', show);
            overlay.classList.toggle('open', show);
            document.body.style.overflow = show ? 'hidden' : '';
        }
        document.getElementById('menuBtn').addEventListener('click', function () { toggleMenu(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') toggleMenu(false); });

        // تعبئة منتجات القائمة (ديناميكية مع كل تحديث للمنتجات)
        function renderMenuProducts(allProducts) {
            const box = document.getElementById('menuProducts');
            if (!box) return;
            box.innerHTML = allProducts.map(function (product) {
                const url = productPageUrl(product);
                if (!url) return '';
                const img = product.img || 'assets/images/nfc2.png';
                return `<a class="menu-link" href="${url}">
                    <img src="${img}" alt="" loading="lazy">
                    <span>${product.name}</span>
                    <span class="m-price">${product.price} د.ك</span>
                </a>`;
            }).join('');
        }

        function renderProducts(allProducts) {
            const grid = document.getElementById('productsGrid');
            renderMenuProducts(allProducts);
            if (!grid) return;
            grid.innerHTML = allProducts.map((product, index) => {
                const url = productPageUrl(product);
                const nameHtml = url
                    ? `<a href="${url}" style="color:inherit;text-decoration:none">${product.name}</a>`
                    : product.name;
                const imgHtml = url
                    ? `<a href="${url}"><img src="${product.img}" alt="${product.name}"></a>`
                    : `<img src="${product.img}" alt="${product.name}">`;
                return `
                <div class="ProductCard" data-price="${product.price}" data-name="${product.name}" data-desc="${(product.desc||'').replace(/"/g,'&quot;')}" data-img="${product.img}">
                    <div class="ProductInfo">
                        <h3 class="ProductName">${nameHtml}</h3>
                        <p class="ProductDesc">${product.desc}</p>
                        <div class="ProductPrice">${product.price} د.ك</div>
                    </div>
                    <div class="ProductImageWrapper">${imgHtml}</div>
                    <button class="AddButton" onclick="updateQuantity(this, 1)">إضافة</button>
                </div>`;
            }).join('');
            // استعادة الكميات المحفوظة في السلة بعد رسم البطاقات
            restoreQuantitiesFromCart();
        }

        async function loadProducts() {
            initializeDefaultProducts();
            let allProducts;
            if (typeof window.storeGetProducts === 'function') {
                allProducts = await window.storeGetProducts();
                if (!allProducts || allProducts.length === 0) {
                    allProducts = JSON.parse(localStorage.getItem('allProducts')) || defaultProducts;
                }
            } else {
                allProducts = JSON.parse(localStorage.getItem('allProducts')) || defaultProducts;
            }
            renderProducts(allProducts);
            if (typeof window.storeWatchProducts === 'function') {
                window.storeWatchProducts(function (items) { renderProducts(items); });
            }
        }

        // تحميل المنتجات عند فتح الصفحة
        document.addEventListener('DOMContentLoaded', function () {
            // اعرض العدد/الإجمالي المحفوظ فوراً قبل تحميل المنتجات
            calculateTotal();
            loadProducts();
        });

        // استعادة الكميات المحفوظة في السلة بعد إعادة رسم المنتجات
        function restoreQuantitiesFromCart() {
            const cart = window.CartGet ? window.CartGet() : [];
            const cartMap = {};
            cart.forEach(function (item) { cartMap[item.name] = item.qty; });

            document.querySelectorAll('.ProductCard').forEach(function (card) {
                const name = card.getAttribute('data-name');
                const savedQty = cartMap[name];
                if (savedQty && savedQty > 0) {
                    const addBtn = card.querySelector('.AddButton');
                    if (addBtn) {
                        const controller = document.createElement('div');
                        controller.className = 'QuantityController';
                        controller.innerHTML = `
                            <button onclick="adjustQty(this, -1)">-</button>
                            <span class="qty-val">${savedQty}</span>
                            <button onclick="adjustQty(this, 1)">+</button>
                        `;
                        addBtn.replaceWith(controller);
                    }
                }
            });
            calculateTotal();
        }

        function getProductFromCard(card) {
            return {
                name: card.getAttribute('data-name'),
                desc: card.getAttribute('data-desc') || '',
                price: card.getAttribute('data-price'),
                img: card.getAttribute('data-img') || ''
            };
        }

        function updateQuantity(buttonElement, change) {
            const card = buttonElement.closest('.ProductCard');
            const product = getProductFromCard(card);
            let controller = card.querySelector('.QuantityController');
            
            if (!controller) {
                // أول إضافة: احفظ في السلة وأنشئ أداة التحكم بالكمية
                if (window.CartAdd) window.CartAdd(product, 1);
                controller = document.createElement('div');
                controller.className = 'QuantityController';
                controller.innerHTML = `
                    <button onclick="adjustQty(this, -1)">-</button>
                    <span class="qty-val">1</span>
                    <button onclick="adjustQty(this, 1)">+</button>
                `;
                buttonElement.replaceWith(controller);
            }
            calculateTotal();
        }

        function adjustQty(btn, change) {
            const card = btn.closest('.ProductCard');
            const product = getProductFromCard(card);
            const controller = btn.closest('.QuantityController');
            const qtySpan = controller.querySelector('.qty-val');
            let currentQty = parseInt(qtySpan.textContent) + change;
            
            if (currentQty <= 0) {
                // حذف المنتج من السلة وإعادة زر "إضافة"
                if (window.CartRemove) window.CartRemove(product.name);
                const newAddBtn = document.createElement('button');
                newAddBtn.className = 'AddButton';
                newAddBtn.textContent = 'إضافة';
                newAddBtn.setAttribute('onclick', 'updateQuantity(this, 1)');
                controller.replaceWith(newAddBtn);
            } else {
                // تحديث الكمية في السلة وفي الواجهة
                if (window.CartSetQty) window.CartSetQty(product.name, currentQty);
                qtySpan.textContent = currentQty;
            }
            calculateTotal();
        }

        function calculateTotal() {
            // احسب من السلة المخزّنة (المصدر الموثوق)
            let total = window.CartTotal ? window.CartTotal() : 0;
            let totalCount = window.CartCount ? window.CartCount() : 0;

            const formattedTotal = total.toFixed(3) + ' د.ك';
            document.getElementById('header-total').textContent = formattedTotal;
            document.getElementById('footer-total').textContent = formattedTotal;
            document.getElementById('footer-count').textContent = totalCount;

            const cartBar = document.getElementById('floating-cart-bar');
            const cartText = document.getElementById('cart-text-content');

            if (totalCount > 0) {
                cartBar.classList.add('active-cart');
                cartText.innerHTML = `<span>&#8249;</span> اذهب الى السلة`;
            } else {
                cartBar.classList.remove('active-cart');
                cartText.textContent = 'سلة المنتجات فارغة';
            }
        }

        function goToCart() {
            let totalCount = parseInt(document.getElementById('footer-count').textContent);
            if (totalCount > 0) {
                window.location.href = 'cartepage.html';
            }
        }
    </script>
</body>
</html>
